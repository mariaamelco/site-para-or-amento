name: Criar Release

# Quando uma tag de versão (ex.: v1.2.0) é enviada, cria a Release no GitHub usando o
# texto da versão no CHANGELOG.md. Se a Release foi criada pela interface do GitHub
# (Releases → Draft a new release), só preenche o texto.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir número da versão no package.json
        run: |
          V="${GITHUB_REF_NAME#v}"
          P="$(node -p "require('./package.json').version")"
          [ "$P" = "$V" ] || { echo "::error::package.json está na versão $P, mas a tag é $GITHUB_REF_NAME"; exit 1; }
      - name: Criar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; if (index($0, "## " tag " ") == 1 || $0 == "## " tag) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Versão $GITHUB_REF_NAME" > notas.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release criada pela interface do GitHub: só preenche o texto com o CHANGELOG
            gh release edit "$GITHUB_REF_NAME" --notes-file notas.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notas.md --verify-tag
          fi
